name: Check and publish browser extension
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formal-release
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Remove retired desktop and video downloads
        shell: bash
        run: |
          set -euo pipefail
          if release_id=$(gh api "repos/$GH_REPO/releases/tags/stable" --jq '.id' 2>/dev/null); then
            for name in BridgeTranslateWindows.zip bridge-translate-demo.mp4; do
              asset_id=$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq ".[] | select(.name == \"$name\") | .id")
              if [[ -n "$asset_id" ]]; then
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              fi
            done
            gh release edit stable --title '桥译 · 正式版' --notes-file docs/发布说明.md
          fi
      - name: Check browser translation behavior
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Package browser extension and source
        run: |
          mkdir -p out
          git archive --format=zip --prefix=BridgeTranslate/ --output=out/BridgeTranslate.zip HEAD
          (cd out && sha256sum BridgeTranslate.zip > SHA256SUMS.txt)
      - name: Publish checked browser release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view stable --json tagName >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/stable" -f "sha=$GITHUB_SHA" -F force=false
            gh release edit stable --title '桥译 · 正式版' --target "$GITHUB_SHA" --notes-file docs/发布说明.md
            gh release upload stable out/BridgeTranslate.zip out/SHA256SUMS.txt --clobber
          else
            gh release create stable out/BridgeTranslate.zip out/SHA256SUMS.txt --title '桥译 · 正式版' --target "$GITHUB_SHA" --notes-file docs/发布说明.md
          fi
